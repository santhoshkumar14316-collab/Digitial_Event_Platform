spring.application.name=digital-event-platform

server.port=8081

# =========================================================================
# DATASOURCE CONFIGURATION
# Default: In-Memory H2 DB for immediate local testing & evaluation.
# To connect to Supabase PostgreSQL:
# 1. Comment out the H2 properties below.
# 2. Uncomment the Supabase PostgreSQL properties and fill in your DB credentials.
# =========================================================================

# --- Default H2 Configuration (Instant Local Test) ---
spring.datasource.url=jdbc:h2:mem:digitaleventdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Supabase PostgreSQL Configuration (Uncomment to enable) ---
# spring.datasource.url=jdbc:postgresql://YOUR_SUPABASE_HOST:5432/postgres
# spring.datasource.username=YOUR_SUPABASE_USERNAME
# spring.datasource.password=YOUR_SUPABASE_PASSWORD
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
